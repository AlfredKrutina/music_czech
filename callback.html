<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spotify Auth — Redirecting...</title>
    <style>
        body {
            background: #0a0a0f;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .message {
            text-align: center;
            padding: 2rem;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(29, 185, 84, 0.2);
            border-top-color: #1DB954;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="message">
        <div class="spinner"></div>
        <p>Authentication complete. This window will close automatically.</p>
    </div>
    <script>
        // Extract the authorization code from the URL query parameters
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const state = params.get('state');
        const error = params.get('error');

        // Send the code back to the opener window
        if (window.opener) {
            window.opener.postMessage(
                { type: 'spotify-auth-callback', code, state, error },
                window.location.origin
            );
            // Attempt to close this popup
            setTimeout(() => window.close(), 500);
        } else {
            // Fallback: if opened as a redirect instead of popup
            document.querySelector('.message p').textContent =
                'Authentication complete. You can close this tab and return to the game.';
        }
    </script>
</body>
</html>
